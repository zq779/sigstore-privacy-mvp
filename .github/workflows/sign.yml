
name: Sigstore Privacy Experiment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sign:
    runs-on: ubuntu-latest

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Create test file
        run: echo "Hello Sigstore" > artifact.txt

      - name: Sign file with Sigstore
        run: |
          cosign sign-blob artifact.txt \
            --bundle artifact.sigstore.json \
            --yes

      - name: Upload signed files
        uses: actions/upload-artifact@v4
        with:
          name: sigstore-evidence
          path: |
            artifact.txt
            artifact.sigstore.json
